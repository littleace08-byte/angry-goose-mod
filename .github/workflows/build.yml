name: Build Minecraft Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: AngryGooseNeoForge
      - name: Build with Gradle
        run: ./gradlew build
        working-directory: AngryGooseNeoForge
      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angrygoose-mod-jar
          path: AngryGooseNeoForge/build/libs/*.jar
